[app]
PageSize = 10

[server]
Host = 0.0.0.0
Port = 9000
RunMode = release

[database]
Name = database

[cert]
HTTPChallengePort = 9180

[nginx]
ConfigDir = /etc/nginx
SbinPath = /usr/sbin/nginx
PIDPath = /var/run/nginx.pid
TestConfigCmd = /usr/sbin/nginx -t
ReloadCmd = /etc/init.d/nginx reload
RestartCmd = /etc/init.d/nginx restart
LogDirWhiteList = /var/log/nginx

[terminal]
StartCmd = /bin/login
